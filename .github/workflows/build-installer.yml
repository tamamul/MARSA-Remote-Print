
name: Build MARSA Remote Print Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/MarsaRemotePrint/MarsaRemotePrint.csproj

      - name: Publish Windows x64
        run: >-
          dotnet publish src/MarsaRemotePrint/MarsaRemotePrint.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }

          if (!(Test-Path $iscc)) {
            throw "ISCC.exe tidak ditemukan."
          }

          & $iscc "installer\MARSA-Remote-Print.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup gagal membuat installer."
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MARSA-Remote-Print-Installer
          path: dist/MARSA-Remote-Print-Setup.exe
          if-no-files-found: error
          retention-days: 14
